<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Essential Mobile Viewport Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Page</title>
</head>
<style>
    body {
        margin: 0;
        padding: 0;
    }

    .parent {
        display: flex;
        flex-direction: column;
        height: 100vh; /* Or any defined height like 500px */
    }

    .header {
      height: 40px; /* Can be any fixed or dynamic height */
    }

    .map {
      flex-grow: 1; 
      width: 100%;
      height: 100%;
    }
</style>
<body class="parent">
    <div class="header">
        <button></button>
    </div>
    <iframe src="/map" class="map"></iframe>
</body>
</html>
