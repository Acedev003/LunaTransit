<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Transit</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents scrollbars from full-screen iframe */
        }

        .parent {
            position: relative; /* Sets boundary context for absolute header */
            width: 100vw;
            height: 100vh;
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            z-index: 1000;
            
            /* Overlay pointer-events fix */
            background-color: transparent;
            pointer-events: none; /* Map interactions pass through empty areas */
            
            /* Right alignment flexbox */
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 12px;
            box-sizing: border-box; /* Prevents 100% width + padding overflow */
        }

        /* Re-enable clicks specifically for header controls */
        .header * {
            pointer-events: auto;
            margin-left: 8px; /* Adds space between the buttons */
        }

        .map {
            width: 100%;
            height: 100%;
            border: none; /* Removes default iframe border */
        }

        dialog div {
            margin-top: 6px;
        }

    </style>
</head>
<body class="parent">
    <dialog id="dialog">
        <div>
            <label>Callsign:<br>
                <input type="text" id="callsign" name="callsign" required />
            </label>
        </div>
        <div>
            <label>Probe Delay:<br>
                <select id="probe_delay" name="probe_delay" required>
                    <option value="0.1">6s</option>
                    <option value="0.5">30s</option>
                    <option value="1">1min</option>
                    <option value="2">2min</option>
                    <option value="5">5min</option>
                </select>
            </label>
        </div>
        <div>
            <label>Transit Target:<br>
                <select id="transit_target" name="transit_target" required>
                    <option value="moon">Moon</option>
                    <option value="sun">Sun</option>
                </select>
            </label>    
        </div>
        <div>
            <label>Track Len (KM):<br>
                <input type="number" id="track_len" name="track_len" required />
            </label>
        </div>
        <div>
            <label>Track Time Delta:<br>
                <select id="track_delta" name="track_delta" required>
                    <option value="0.5">30s</option>
                    <option value="1">1min</option>
                    <option value="2">2min</option>
                    <option value="5">5min</option>
                    <option value="10">10min</option>
                </select>
            </label>
        </div>
        <div>
            <label>Test Offset Hours:<br>
                <input type="number" min="0" max="24" id="debug_offset" name="debug_offset" required />
            </label>
        </div>
        <br>
        <button id="update_close">Update</button>
    </dialog>
    <div class="header">
        <button id="setdata">Set Data</button>
        <button id="calc">Calculate</button>
        <button id="interrupt">Interrupt</button>
        <button id="clear">Reset</button>
    </div>
    <iframe id="map_frame" src="/map" class="map"></iframe>
    <script>
        const dialog        = document.getElementById("dialog");
        const dat_btn       = document.getElementById("setdata");
        const cls_btn       = document.getElementById("update_close");
        const calc_btn      = document.getElementById("calc");
        const interrupt_btn = document.getElementById("interrupt");
        const clear_btn     = document.getElementById("clear");
        const map_iframe    = document.getElementById("map_frame");

        const inp_callsign       = document.getElementById("callsign");
        const inp_probe_delay    = document.getElementById("probe_delay");
        const inp_transit_target = document.getElementById("transit_target");
        const inp_track_len      = document.getElementById("track_len");
        const inp_track_delta    = document.getElementById("track_delta");
        const inp_debug_offset   = document.getElementById("debug_offset");
        
        let callsign       = "";        // str
        let probe_delay    = 0.5;       // mins
        let transit_target = "moon";    // moon, sun
        let track_len      = 2000;      // km
        let track_delta    = 1;         // mins
        let debug_offset   = 0;         // hours

        let pollTimer      = null;

        dat_btn.onclick = () => {
            inp_callsign.value       = callsign;
            inp_probe_delay.value    = probe_delay;
            inp_transit_target.value = transit_target;
            inp_track_len.value      = track_len;
            inp_track_delta.value    = track_delta;
            inp_debug_offset.value   = debug_offset;
            dialog.showModal();
        };
        
        cls_btn.onclick = () => {
            callsign       = inp_callsign.value;
            probe_delay    = parseFloat(inp_probe_delay.value);
            transit_target = inp_transit_target.value;
            track_len      = parseFloat(inp_track_len.value);
            track_delta    = parseFloat(inp_track_delta.value);
            debug_offset   = parseFloat(inp_debug_offset.value);
            dialog.close();
        };

        async function pollStatus() {
            try {
                const res = await fetch("/calc/poll");
                const data = await res.json();

                if (data.status === "running") {
                    pollTimer = setTimeout(pollStatus, 1000);
                } else if (data.status === "completed") {
                    // Reload map iframe to reflect updated state
                    map_iframe.src = "/map?" + new Date().getTime();
                    calc_btn.disabled = false;
                } else {
                    calc_btn.disabled = false;
                }
            } catch (err) {
                console.error("Polling error:", err);
                calc_btn.disabled = false;
            }
        }

        calc_btn.onclick = async () => {
            if (!callsign) {
                alert("Please specify a Callsign first.");
                return;
            }

            const payload = {
                callsign: callsign,
                probe_delay: probe_delay,
                transit_target: transit_target,
                track_len: track_len,
                track_delta: track_delta,
                debug_offset: debug_offset
            };

            calc_btn.disabled = true;

            try {
                const res = await fetch("/calc/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    pollStatus();
                } else {
                    const err = await res.json();
                    alert("Calculation failed: " + (err.detail || "Error starting calculation"));
                    calc_btn.disabled = false;
                }
            } catch (err) {
                console.error("Calculation request failed:", err);
                calc_btn.disabled = false;
            }
        };

        interrupt_btn.onclick = async () => {
            if (pollTimer) clearTimeout(pollTimer);

            try {
                await fetch("/calc/interrupt", { method: "POST" });
            } catch (err) {
                console.error("Interrupt failed:", err);
            } finally {
                calc_btn.disabled = false;
            }
        };

        clear_btn.onclick = async () => {
            if (pollTimer) clearTimeout(pollTimer);

            try {
                // Call map reset route and reload iframe canvas
                await fetch("/map/reset");
                map_iframe.src = "/map?" + new Date().getTime();
            } catch (err) {
                console.error("Reset failed:", err);
            } finally {
                calc_btn.disabled = false;
            }
        };
    </script>
</body>
</html>
